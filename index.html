<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card GSAP</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  </head>
  <body class="bg-blue-200/20">
    <section
      class="min-h-screen card-section w-full flex items-center justify-center overflow-hidden"
    >
      <div
        class="card-container w-full relative flex items-center justify-center [perspective:1000px]"
      >
        <div
          class="card card-left absolute w-[160px] h-[280px] md:w-[190px] md:h-[300px] rounded-md overflow-hidden"
        >
          <img
            src="https://images.unsplash.com/photo-1502082553048-f009c37129b9"
            class="w-full h-full object-cover"
            alt=""
          />
        </div>

        <div
          class="card card-center z-10 absolute w-[160px] h-[280px] md:w-[190px] md:h-[300px] rounded-md overflow-hidden"
        >
          <img
            src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
            class="w-full h-full object-cover"
            alt=""
          />
        </div>
        <div
          class="card card-right absolute w-[160px] h-[280px] md:w-[190px] md:h-[300px] rounded-md overflow-hidden"
        >
          <img
            src="https://images.unsplash.com/photo-1472396961693-142e6e269027"
            class="w-full h-full object-cover"
            alt=""
          />
        </div>
      </div>
    </section>

    <script>
      const tl = gsap.timeline({
        scrollTrigger: {
          trigger: ".card-section",
          start: "top top",
          scrub: 1,
          end: "+=1200",
          pin: true,
        },
      });

      tl.to(".card-container", {
        scale: 1.2,
        duration: 2,
        ease: "none",
      });

      tl.to(
        ".card-left",
        {
          x: -165,
          rotation: -11,
          rotateY: 40,
          duration: 2,
          ease: "none",
          transformOrigin: "center center",
        },
        "<",
      );

      tl.to(
        ".card-right",
        {
          x: 165,
          rotation: 11,
          rotateY: -40,
          duration: 2,
          ease: "none",
          transformOrigin: "center center",
        },
        "<",
      );
    </script>
  </body>
</html>
